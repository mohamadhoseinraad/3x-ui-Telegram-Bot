{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>{{ t('support') }}</h2>
  <form method="post" class="grid-form">
    <label>{{ t('new_ticket_subject') }}
      <input type="text" name="subject" required>
    </label>
    <button type="submit">{{ t('create_ticket') }}</button>
  </form>
</section>

<section class="card">
  <h3>{{ t('ticket_list') }}</h3>
  {% if not tickets %}
    <p>{{ t('no_services') }}</p>
  {% else %}
    <ul class="list">
      {% for t in tickets %}
      <li>
        <a href="{{ url_for('ticket_detail', ticket_id=t[0]) }}">#{{ t[0] }} - {{ t[1] }}</a>
        <span class="badge">{{ t[2] }}</span>
      </li>
      {% endfor %}
    </ul>
  {% endif %}
</section>
{% endblock %}
