{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>{{ t('buy_service') }}</h2>
  {% if not allow_buy %}
    <p class="warn">{{ t('sales_disabled') }}</p>
  {% else %}
    <form method="post" class="grid-form">
      <label>{{ t('buy_service') }}
        <select name="plan_key" required>
          {% for key, plan in plans.items() %}
          <option value="{{ key }}">{{ plan.name }} ({{ plan.gb }}GB)</option>
          {% endfor %}
        </select>
      </label>
      <label>{{ t('receipt_hint') }}
        <input type="text" name="receipt" required>
      </label>
      <button type="submit">{{ t('buy_service') }}</button>
    </form>
    <p class="hint">{{ payment_msg }}</p>
  {% endif %}
</section>
{% endblock %}
