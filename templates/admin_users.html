{% extends 'base.html' %}
{% block content %}
<section class="card">
  <h2>Users</h2>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Username</th>
          <th>Configs</th>
          <th>Last Config</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u['user_id'] }}</td>
          <td>{{ u['first_name'] }}</td>
          <td>{{ u['username'] or '-' }}</td>
          <td>{{ u['config_count'] }}</td>
          <td>{{ u['last_created'] or '-' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
