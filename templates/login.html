{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h2>{{ t('sign_in') }}</h2>
  <p>{{ t('login_note') }}</p>
  <form method="post" class="grid-form">
    <label>{{ t('username_label') }}
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label>{{ t('password_label') }}
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <label>{{ t('invite_code_label') }}
      <input type="text" name="invite_code" autocomplete="one-time-code">
    </label>
    <label>{{ t('contact_info_label') }}
      <input type="text" name="contact_info" placeholder="{{ t('contact_info_placeholder') }}">
    </label>
    <p class="form-hint">{{ t('contact_info_hint') }}</p>
    <p class="form-hint">{{ t('invite_code_hint') }}</p>
    <button type="submit">{{ t('sign_in') }}</button>
  </form>
</section>
{% endblock %}
